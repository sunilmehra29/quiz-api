name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Post coverage comment on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NEW — Phase 4 steps below

      - name: Wait for Render to deploy
        if: github.event_name == 'push'
        run: |
          echo "Waiting 30 seconds for Render to deploy..."
          sleep 30

      - name: Health check on live app
        if: github.event_name == 'push'
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://quiz-api-e5g1.onrender.com/health)
          if [ "$response" != "200" ]; then
            echo "Health check FAILED! Got HTTP $response"
            exit 1
          fi
          echo "Health check PASSED! App is alive."

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🚨 CI Pipeline FAILED!\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.event.head_commit.message }}\nBy: ${{ github.actor }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
